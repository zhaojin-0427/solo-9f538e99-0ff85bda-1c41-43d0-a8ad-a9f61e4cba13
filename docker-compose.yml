services:
  cadastre-api:
    build: .
    image: cadastre-shared-boundary:1.0
    container_name: cadastre-api
    ports:
      - "8000:8000"
    environment:
      CADASTRE_DB_PATH: /data/cadastre.db
      SURVEY_AREA_NAME: "默认测区"
    volumes:
      - cadastre-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  cadastre-data:
